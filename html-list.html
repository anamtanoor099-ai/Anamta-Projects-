<!DOCTYPE html>
<html>
    <head>
        <title>HTML lists</title>
    </head>
    <body>
        <h2>Ordered list</h2>
        <ol>
            <li>C</li>
            <li>C++</li>
            <li>Python</li>
            <li>Html</li>
        </ol>
        <h2>Unordered list</h2>
        <ul>
            <li>Apple</li>
            <li>Mango</li>
            <li>Orange</li>
        </ul>
        <h2>Definition list</h2>
        <dl>
            <dt>HTML</dt>
            <dd>Hyper Text Markup Language</dd>
            <dt>CSS</dt>
            <dd>Cascoding style sheets</dd>
            <dt>PHP</dt>
            <dd>Hypertext preprocessor</dd>
        </dl>
    </body>
</html>
